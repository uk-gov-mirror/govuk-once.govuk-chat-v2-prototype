[project]
name = "agent-dev"
version = "0.1.0"
description = "Repository development tooling for agents"
readme = "README.md"
dependencies = []

[project.scripts]
agent-dev = "agent_dev.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
